<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LokoYar - Login/Register</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Staatliches&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <img src="pngwing.com.png" alt="LokoYar Logo">
            <h1>LokoYar</h1>
        </div>
        <div class="form-toggle">
            <button id="show-login-btn" class="toggle-btn active">Login</button>
            <button id="show-register-btn" class="toggle-btn">Register</button>
        </div>

        <div id="form-content">
            <!-- Login Form -->
            <form id="login-form">
                <label for="login-email">Email</label>
                <input type="text" id="login-email" name="login-email" required>
                <label for="login-password">Password</label>
                <input type="password" id="login-password" name="login-password" required>
                <button type="submit" class="submit-btn">Log In</button>
            </form>

            <!-- Registration Form -->
            <form id="register-form" class="hidden">
                <label for="register-first-name">First Name</label>
                <input type="text" id="register-first-name" name="register-first-name" required>
                <label for="register-last-name">Last Name</label>
                <input type="text" id="register-last-name" name="register-last-name" required>
                <label for="register-email">Email</label>
                <input type="email" id="register-email" name="register-email" required>
                <label for="register-password">Password</label>
                <input type="password" id="register-password" name="register-password" required>
                <label for="register-confirm-password">Confirm Password</label>
                <input type="password" id="register-confirm-password" name="register-confirm-password" required>
                <button type="submit" class="submit-btn">Create Account</button>
            </form>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
